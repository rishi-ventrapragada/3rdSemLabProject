{% if form.non_field_errors %}
  <div class="alert alert-error" role="alert">{% for error in form.non_field_errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</div>
{% endif %}
<div class="form-grid">
  {% for field in form %}
    <div class="field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
      {{ field.errors }}
    </div>
  {% endfor %}
</div>
